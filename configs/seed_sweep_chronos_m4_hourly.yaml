name: seed_sweep_chronos_m4_hourly
seeds: [0, 1, 2, 3, 4]
correctors:
  - config: configs/corrector_v1_chronos_m4_hourly.yaml
  - config: configs/corrector_v2_chronos_m4_hourly.yaml
rule_search:
  metric: mase
  select_on: val
  device: cpu
  residuals: residuals_chronos_m4_hourly
  search:
    features:
      - abs_diff_mean
      - cv
      - seasonal_corr
      - trend_corr
      - n_train
    quantiles: [0.5, 0.6, 0.7, 0.75, 0.8, 0.9]
    directions: [high, low]
notes: >
  Multi-seed replication of R7. For each seed: train/reuse corrector (series
  split + training seed), select abstain rule on val, score test once. Seed 0
  reuses the existing R3/R4 runs when present. Aggregate win rate and rule
  stability before investing in a learned gate.
